name: CI/CD Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run test suite
      env:
        CI: true
      run: |
        python -m unittest discover tests -v

    - name: Run CLI health checks (Doctor)
      env:
        CI: true
      run: |
        python main.py

  build:
    name: Build Executables
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY.exe

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY.app / dist/F-SOCIETY

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: F-SOCIETY-${{ matrix.os }}
        path: |
          dist/F-SOCIETY.exe
          dist/F-SOCIETY
          dist/F-SOCIETY.app
        if-no-files-found: ignore
