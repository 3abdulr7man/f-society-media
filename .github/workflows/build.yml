name: CI/CD Build and Test

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run test suite
      env:
        CI: true
      run: |
        python -m unittest discover tests/unit -v

    - name: Run CLI health checks (Doctor)
      env:
        CI: true
      run: |
        python main.py

  build:
    name: Build Executables
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY.exe

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --name=F-SOCIETY main.py
      # Output in dist/F-SOCIETY / dist/F-SOCIETY.app

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: F-SOCIETY-${{ matrix.os }}
        path: |
          dist/F-SOCIETY.exe
          dist/F-SOCIETY
          dist/F-SOCIETY.app
        if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "F-SOCIETY MEDIA CENTER ${{ github.ref_name }} - Stable Release"
          body: |
            ## F-SOCIETY MEDIA CENTER Stable Release

            We are pleased to announce the release of F-SOCIETY MEDIA CENTER.

            ### Added Features
            - Modern TUI dashboard (Textual-based) with looping hacker-theme status GIF widget.
            - Redesigned Cyberpunk settings and diagnostics menus.
            - Manual "Check for Updates" and "Force Update" section in Settings.
            - Windows CMD launcher `run.bat` auto-pauses on exit failures.

            ### CI/CD & Testing
            - 100% deterministic, network-free, offline-safe unit tests in CI environment.
            - Upgraded all GitHub Actions workflows to latest versions (`checkout@v4`, `setup-python@v5`, `upload-artifact@v4`).
            - Proper mock testing system for `yt-dlp` metadata extraction.

            ### Stability & Performance
            - Fixed TUI layout/CSS parsing crashes (removed unsupported `font-family`, corrected `border-right`, fixed layout ordering).
            - Disables full TUI when headless CI mode is detected (`CI=true`), executing diagnostic checks instead.
            - Wrapped TUI startup in a safe exception handler block showing tracebacks in a clean console panel.
          files: |
            dist-artifacts/F-SOCIETY-windows-latest/F-SOCIETY.exe
            dist-artifacts/F-SOCIETY-ubuntu-latest/F-SOCIETY
            dist-artifacts/F-SOCIETY-macos-latest/F-SOCIETY
            resources/tui_screenshot.png
